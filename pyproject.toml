[project]
name = "codelens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.8.0",
    "fastembed>=0.7.3",
    "pylate>=1.1.0",
    "sqlmodel>=0.0.37",
    "tree-sitter>=0.25.2",
    "tree-sitter-java>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codelens"]

[project.scripts]
codelens = "codelens.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]


[tool.coverage.run]
source = ["src/codelens"]
branch = true
omit = ["tests/*"]
